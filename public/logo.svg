<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Hexagon / Shield Base -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#primaryGrad)" filter="url(#glow)" />
  
  <!-- Subtle Internal Border -->
  <rect x="5.5" y="5.5" width="37" height="37" rx="8.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Stylized Technical / CSE Motif: Code Bracket & Circuit Nodes -->
  <!-- Left Bracket -->
  <path d="M18 16L12 24L18 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket -->
  <path d="M30 16L36 24L30 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center Slash / Core Circuit Node -->
  <path d="M26 15L22 33" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Circuit Nodes -->
  <circle cx="24" cy="24" r="2.5" fill="#38BDF8" />
  <circle cx="18" cy="16" r="1.5" fill="#FFFFFF" />
  <circle cx="30" cy="32" r="1.5" fill="#FFFFFF" />
</svg>
